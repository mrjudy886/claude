<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self';">
  <link rel="stylesheet" href="game-panel.css">
  <title>Clawd - Game Panel</title>
</head>
<body>
  <div class="title-bar">
    <span class="title-bar-text">Clawd Game Panel</span>
    <div class="title-bar-controls">
      <button class="title-btn" id="btn-minimize" title="Minimize">&#x2500;</button>
      <button class="title-btn title-btn-close" id="btn-close" title="Close">&#x2715;</button>
    </div>
  </div>
  <div class="game-layout">
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
      <button class="nav-tab active" data-tab="status">
        <span class="tab-icon">&#x2764;</span>
        <span>Status</span>
      </button>
      <button class="nav-tab" data-tab="inventory">
        <span class="tab-icon">&#x1F392;</span>
        <span>Bag</span>
      </button>
      <button class="nav-tab" data-tab="shop">
        <span class="tab-icon">&#x1F6D2;</span>
        <span>Shop</span>
      </button>
      <button class="nav-tab" data-tab="garden">
        <span class="tab-icon">&#x1F331;</span>
        <span>Garden</span>
      </button>
      <button class="nav-tab" data-tab="games">
        <span class="tab-icon">&#x1F3AE;</span>
        <span>Games</span>
      </button>
      <button class="nav-tab" data-tab="achievements">
        <span class="tab-icon">&#x1F3C6;</span>
        <span>Awards</span>
      </button>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Top Bar -->
      <div class="top-bar">
        <span class="pet-name" id="pet-name">Clawd</span>
        <div class="level-badge">
          <span>LV</span>
          <span id="level-num">1</span>
        </div>
        <div class="xp-bar-container">
          <div class="xp-bar-fill" id="xp-bar" style="width:0%"></div>
          <span class="xp-text" id="xp-text">0 / 100 XP</span>
        </div>
        <div class="coins-display">
          <span class="coins-icon">&#x1FA99;</span>
          <span id="coins-count">100</span>
        </div>
      </div>

      <!-- Status Tab -->
      <div class="tab-content active" id="tab-status">
        <div class="section-title">Pet Status</div>
        <div class="status-grid">
          <div class="stat-row">
            <span class="stat-icon">&#x1F354;</span>
            <div class="stat-info">
              <div class="stat-label">
                <span>Hunger</span>
                <span class="stat-value" id="hunger-val">100</span>
              </div>
              <div class="stat-bar">
                <div class="stat-bar-fill high" id="hunger-bar" style="width:100%"></div>
              </div>
            </div>
            <div class="stat-actions">
              <button class="action-btn" data-action="feed">Feed</button>
            </div>
          </div>
          <div class="stat-row">
            <span class="stat-icon">&#x1F60A;</span>
            <div class="stat-info">
              <div class="stat-label">
                <span>Happiness</span>
                <span class="stat-value" id="happiness-val">100</span>
              </div>
              <div class="stat-bar">
                <div class="stat-bar-fill high" id="happiness-bar" style="width:100%"></div>
              </div>
            </div>
            <div class="stat-actions">
              <button class="action-btn" data-action="play">Play</button>
            </div>
          </div>
          <div class="stat-row">
            <span class="stat-icon">&#x26A1;</span>
            <div class="stat-info">
              <div class="stat-label">
                <span>Energy</span>
                <span class="stat-value" id="energy-val">100</span>
              </div>
              <div class="stat-bar">
                <div class="stat-bar-fill high" id="energy-bar" style="width:100%"></div>
              </div>
            </div>
            <div class="stat-actions">
              <button class="action-btn" data-action="rest">Rest</button>
            </div>
          </div>
          <div class="stat-row">
            <span class="stat-icon">&#x1F6C1;</span>
            <div class="stat-info">
              <div class="stat-label">
                <span>Cleanliness</span>
                <span class="stat-value" id="cleanliness-val">100</span>
              </div>
              <div class="stat-bar">
                <div class="stat-bar-fill high" id="cleanliness-bar" style="width:100%"></div>
              </div>
            </div>
            <div class="stat-actions">
              <button class="action-btn" data-action="clean">Clean</button>
            </div>
          </div>
          <div class="stat-row">
            <span class="stat-icon">&#x1FA7A;</span>
            <div class="stat-info">
              <div class="stat-label">
                <span>Health</span>
                <span class="stat-value" id="health-val">100</span>
              </div>
              <div class="stat-bar">
                <div class="stat-bar-fill high" id="health-bar" style="width:100%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Inventory Tab -->
      <div class="tab-content" id="tab-inventory">
        <div class="section-title">Inventory</div>
        <div class="inventory-grid" id="inventory-grid">
          <!-- Filled by JS -->
        </div>
      </div>

      <!-- Shop Tab -->
      <div class="tab-content" id="tab-shop">
        <div class="section-title">Shop</div>
        <div class="shop-categories" id="shop-categories">
          <!-- Filled by JS -->
        </div>
        <div class="shop-grid" id="shop-grid">
          <!-- Filled by JS -->
        </div>
      </div>

      <!-- Garden Tab -->
      <div class="tab-content" id="tab-garden">
        <div class="section-title">Garden</div>
        <div class="garden-grid" id="garden-grid">
          <!-- 4x4 grid filled by JS -->
        </div>
        <div class="garden-tools" id="garden-tools">
          <!-- Filled by JS -->
        </div>
        <div class="seed-selector" id="seed-selector">
          <div class="section-title">Select a Seed</div>
          <div class="seed-list" id="seed-list">
            <!-- Filled by JS -->
          </div>
        </div>
      </div>

      <!-- Games Tab -->
      <div class="tab-content" id="tab-games">
        <div class="section-title">Mini-Games</div>
        <div class="games-list" id="games-list">
          <!-- Filled by JS -->
        </div>
        <div class="mini-game-area" id="mini-game-area">
          <!-- Mini-game renders here -->
        </div>
      </div>

      <!-- Achievements Tab -->
      <div class="tab-content" id="tab-achievements">
        <div class="section-title">Achievements</div>
        <div class="achievements-grid" id="achievements-grid">
          <!-- Filled by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box" id="modal-box">
      <div class="modal-icon" id="modal-icon"></div>
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-desc" id="modal-desc"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <script src="game-panel.js"></script>
</body>
</html>
