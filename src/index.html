<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file:; media-src 'self' file:;">
  <link rel="stylesheet" href="styles.css">
  <title>Clawd</title>
</head>
<body>
  <div id="pet-container">
    <div id="pet-facing-stage">
      <div id="pet-media-layer">
        <object id="clawd" class="clawd-object" type="image/svg+xml"></object>
      </div>
    </div>
  </div>
  <div id="context-menu" class="context-menu hidden">
    <div class="menu-item menu-header" data-action="game-panel">🎮 游戏面板</div>
    <div class="menu-separator"></div>
    <div class="menu-item" data-action="idle">待机</div>
    <div class="menu-item" data-action="thinking">思考</div>
    <div class="menu-item" data-action="working">工作</div>
    <div class="menu-item" data-action="happy">开心</div>
    <div class="menu-item" data-action="sleep">睡觉</div>
    <div class="menu-item" data-action="roam">散步</div>
    <div class="menu-separator"></div>
    <div class="menu-item" data-action="auto">自动模式</div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
